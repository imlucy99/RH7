<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Musik Speedo</title>
<style>
  :root { --bg:#0b0c0f; --card:#16181d; --line:#272a31; --ink:#f2f4f8; --dim:#8c93a0; --red:#e0262b; --blue:#36c3ff; --green:#22d65a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, 'Segoe UI', sans-serif; padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; letter-spacing: 2px; font-weight: 800; }
  h1 span { color: var(--red); }
  .sub { color: var(--dim); font-size: 13px; margin: 2px 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }
  input[type=text], input[type=url] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: #0d0e11; color: var(--ink); font-size: 15px; margin-bottom: 10px; }
  input:focus { outline: none; border-color: var(--blue); }
  button { cursor: pointer; border: 1px solid var(--line); background: #20232a; color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; }
  button:hover { border-color: var(--blue); }
  button:active { transform: scale(0.97); }
  button.pri { background: var(--red); border-color: var(--red); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .status { font-size: 13px; color: var(--dim); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .now { font-size: 18px; font-weight: 700; margin-bottom: 4px; word-break: break-word; }
  .time { color: var(--blue); font-family: ui-monospace, monospace; margin-bottom: 12px; }
  .transport { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
  .transport button { padding: 12px 0; font-size: 18px; }
  input[type=range] { width: 100%; accent-color: var(--red); }
  .vol { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .vol b { width: 44px; text-align: right; font-size: 14px; }
  .q { list-style: none; }
  .q li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .q li:last-child { border-bottom: 0; }
  .q li.cur .t { color: var(--red); font-weight: 800; }
  .q .t { flex: 1; cursor: pointer; word-break: break-word; font-size: 15px; }
  .q button { padding: 6px 10px; font-size: 13px; }
  .empty { color: var(--dim); font-size: 14px; padding: 6px 0; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); }
  .toggle input { width: 18px; height: 18px; accent-color: var(--red); }
  .msg { font-size: 13px; color: #ffb800; min-height: 18px; }
  details summary { cursor: pointer; font-weight: 700; }
  .sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 12px; }
  .sw button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; font-size: 12px; }
  .sw i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
  .sw button.sel { border-color: var(--ink); background: #2a2d35; }
  .colors { display: flex; gap: 12px; margin-bottom: 12px; }
  .colors label { flex: 1; margin: 0; }
  input[type=color] { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #0d0e11; padding: 2px; margin-top: 4px; cursor: pointer; }
  .sl { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; }
  .sl span { width: 70px; color: var(--dim); }
  .sl b { width: 44px; text-align: right; font-size: 14px; }
  details .in { margin-top: 12px; }
</style>
</head>
<body>

<h1>REMOTE <span>MUSIK</span></h1>
<div class="sub">Kontrol lagu untuk speedo R34 GT-R. Semua yang ada di room yang sama ikut mendengar.</div>

<div class="card">
  <details id="cfg">
    <summary>Pengaturan room</summary>
    <div class="in">
      <label>DATABASE URL (Firebase Realtime Database)</label>
      <input type="url" id="db" placeholder="https://nama-project-default-rtdb.asia-southeast1.firebasedatabase.app" />
      <label>NAMA ROOM (harus sama dengan MUSIC_ROOM di music.js)</label>
      <input type="text" id="room" placeholder="garasi-lucy" />
      <button id="save" class="pri" type="button">Simpan &amp; sambung</button>
    </div>
  </details>
</div>

<div class="card">
  <div class="status"><i class="dot" id="dot"></i><span id="stat">Belum tersambung</span></div>
  <div class="now" id="now">Belum ada lagu</div>
  <div class="time" id="time">0:00</div>
  <div class="transport">
    <button id="prev" type="button" title="Sebelumnya">&#9198;</button>
    <button id="back" type="button" title="Mundur 10 detik">-10</button>
    <button id="pp" type="button" class="pri" title="Play / Pause">&#9654;</button>
    <button id="fwd" type="button" title="Maju 10 detik">+10</button>
    <button id="next" type="button" title="Berikutnya">&#9197;</button>
  </div>
  <div class="vol"><span>Volume</span><input type="range" id="vol" min="0" max="100" value="80" /><b id="volv">80%</b></div>
  <label class="toggle"><input type="checkbox" id="loop" /> Ulangi playlist</label>
</div>

<div class="card">
  <label>LINK LAGU (MP3 / OGG / stream audio langsung)</label>
  <input type="url" id="url" placeholder="https://contoh.com/lagu.mp3" />
  <label>JUDUL (boleh kosong)</label>
  <input type="text" id="title" placeholder="Judul lagu" />
  <div class="row">
    <button id="add" type="button" class="pri">Tambah &amp; putar</button>
    <button id="addq" type="button">Tambah ke antrean</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div class="row" style="align-items:center;margin-bottom:6px">
    <b>Antrean</b>
    <button id="clear" type="button" style="flex:none">Kosongkan</button>
  </div>
  <ul class="q" id="q"></ul>
</div>

<div class="card">
  <b>Tema speedo</b>
  <div class="sub" style="margin:2px 0 0">Berlaku untuk semua speedo di room ini.</div>
  <div class="sw" id="sw"></div>
  <div class="colors">
    <label>WARNA UTAMA (kustom)<input type="color" id="cmain" value="#ff8800" /></label>
    <label>WARNA ANGKA<input type="color" id="cink" value="#f4f6fa" /></label>
  </div>
  <div class="sl"><span>Kecerahan</span><input type="range" id="dim" min="15" max="100" value="100" /><b id="dimv">100%</b></div>
  <div class="sl"><span>Ukuran HUD</span><input type="range" id="scl" min="30" max="100" value="55" /><b id="sclv">55%</b></div>
  <button id="treset" type="button" style="width:100%;margin-top:6px">Kembali ke tema asli</button>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } };

  let DB = (qs.get('db') || store('mdb') || '').replace(/\/+$/, '');
  let ROOM = (qs.get('room') || store('mroom') || 'garasi-lucy').replace(/[.#$\[\]\/]/g, '_');
  $('db').value = DB; $('room').value = ROOM;
  if (!DB) $('cfg').open = true;

  let st = null, offset = 0, es = null;
  const stateUrl = () => `${DB}/rooms/${ROOM}/state.json`;
  const serverNow = () => Date.now() + offset;
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const flash = (t) => { $('msg').textContent = t; if (t) setTimeout(() => { if ($('msg').textContent === t) $('msg').textContent = ''; }, 4000); };

  function curPos() {
    if (!st) return 0;
    return (st.pos || 0) + (st.playing ? (serverNow() - (st.at || serverNow())) / 1000 : 0);
  }

  async function syncClock() {
    const id = 'r' + Math.random().toString(36).slice(2, 7), url = `${DB}/rooms/${ROOM}/ping/${id}.json`;
    let best = null;
    for (let i = 0; i < 3; i++) {
      try {
        const t0 = Date.now(), sv = await (await fetch(url, { method: 'PUT', body: JSON.stringify({ '.sv': 'timestamp' }) })).json(), t1 = Date.now();
        if (typeof sv === 'number' && (!best || t1 - t0 < best.rtt)) best = { rtt: t1 - t0, off: sv - (t0 + t1) / 2 };
      } catch (e) {}
    }
    fetch(url, { method: 'DELETE' }).catch(() => {});
    if (best) offset = best.off;
    return !!best;
  }

  // Tulis state baru. pos = posisi saat ini, at = jam server saat perintah ini ditulis
  async function commit(patch) {
    if (!DB) { flash('Isi Database URL dulu di Pengaturan room.'); $('cfg').open = true; return; }
    const base = st || { queue: [], idx: 0, vol: 0.8, loop: false, rev: 0 };
    const next = Object.assign({}, base, { pos: Math.max(0, curPos()), playing: !!base.playing }, patch, { at: { '.sv': 'timestamp' } });
    if (!next.queue) next.queue = [];
    try {
      const r = await fetch(stateUrl(), { method: 'PUT', body: JSON.stringify(next) });
      if (!r.ok) throw new Error(r.status);
      const saved = await r.json();
      st = saved;                       // tampilan langsung ikut; stream akan mengonfirmasi
      render();
    } catch (e) {
      flash('Gagal menulis ke database. Cek URL dan aturan (rules) Firebase.');
    }
  }

  function addTrack(play) {
    const url = $('url').value.trim();
    if (!/^https?:\/\//i.test(url)) { flash('Link harus diawali http:// atau https://'); return; }
    const title = $('title').value.trim() || decodeURIComponent((url.split('?')[0].split('/').pop() || url)).replace(/\.[a-z0-9]{2,4}$/i, '') || url;
    const queue = ((st && st.queue) || []).slice();
    queue.push({ url, title });
    const patch = { queue };
    if (play || queue.length === 1) Object.assign(patch, { idx: queue.length - 1, pos: 0, playing: true, rev: ((st && st.rev) || 0) + 1 });
    commit(patch);
    $('url').value = ''; $('title').value = '';
  }

  const hasQ = () => st && st.queue && st.queue.length;
  const go = (i) => { const n = st.queue.length; if (i < 0) i = 0; if (i >= n) i = n - 1; commit({ idx: i, pos: 0, playing: true, rev: (st.rev || 0) + 1 }); };

  $('add').onclick = () => addTrack(true);
  $('addq').onclick = () => addTrack(false);
  $('pp').onclick = () => { if (hasQ()) commit({ playing: !st.playing }); };
  $('next').onclick = () => { if (hasQ()) go((st.idx || 0) + 1); };
  $('prev').onclick = () => { if (!hasQ()) return; if (curPos() > 4) commit({ pos: 0, rev: (st.rev || 0) + 1 }); else go((st.idx || 0) - 1); };
  $('fwd').onclick = () => { if (hasQ()) commit({ pos: curPos() + 10, rev: (st.rev || 0) + 1 }); };
  $('back').onclick = () => { if (hasQ()) commit({ pos: Math.max(0, curPos() - 10), rev: (st.rev || 0) + 1 }); };
  $('loop').onchange = () => { if (st) commit({ loop: $('loop').checked }); };
  let volT = 0;
  $('vol').oninput = () => {
    $('volv').textContent = $('vol').value + '%';
    clearTimeout(volT);
    volT = setTimeout(() => commit({ vol: $('vol').value / 100 }), 250);
  };
  $('clear').onclick = async () => {
    if (!DB || !confirm('Kosongkan antrean dan hentikan musik?')) return;
    try { await fetch(stateUrl(), { method: 'DELETE' }); st = null; render(); } catch (e) { flash('Gagal menghapus.'); }
  };
  $('save').onclick = () => {
    DB = $('db').value.trim().replace(/\/+$/, '');
    ROOM = ($('room').value.trim() || 'garasi-lucy').replace(/[.#$\[\]\/]/g, '_');
    store('mdb', DB); store('mroom', ROOM);
    $('cfg').open = false;
    connect();
  };

  function render() {
    const q = (st && st.queue) || [];
    const idx = (st && st.idx) || 0;
    const tr = q[idx];
    $('now').textContent = tr ? tr.title || tr.url : 'Belum ada lagu';
    $('pp').innerHTML = st && st.playing ? '&#9208;' : '&#9654;';
    if (st && st.vol != null && document.activeElement !== $('vol')) { $('vol').value = Math.round(st.vol * 100); $('volv').textContent = $('vol').value + '%'; }
    $('loop').checked = !!(st && st.loop);
    const ul = $('q');
    ul.innerHTML = '';
    if (!q.length) { ul.innerHTML = '<li class="empty">Antrean kosong. Tambahkan link lagu di atas.</li>'; return; }
    q.forEach((t, i) => {
      const li = document.createElement('li');
      if (i === idx) li.className = 'cur';
      const s = document.createElement('span'); s.className = 't'; s.textContent = (i === idx ? (st.playing ? '▶ ' : '⏸ ') : (i + 1) + '. ') + (t.title || t.url);
      s.onclick = () => go(i);
      const d = document.createElement('button'); d.textContent = 'Hapus';
      d.onclick = () => {
        const nq = q.slice(); nq.splice(i, 1);
        const patch = { queue: nq };
        if (i < idx) patch.idx = idx - 1;
        else if (i === idx) { patch.idx = Math.min(idx, Math.max(0, nq.length - 1)); patch.pos = 0; patch.rev = (st.rev || 0) + 1; if (!nq.length) patch.playing = false; }
        commit(patch);
      };
      li.append(s, d); ul.append(li);
    });
  }

  setInterval(() => { $('time').textContent = hasQ() ? fmt(curPos()) : '0:00'; }, 500);

  function setStat(ok, t) { $('dot').className = 'dot' + (ok ? ' ok' : ''); $('stat').textContent = t; }

  async function connect() {
    if (es) { es.close(); es = null; }
    if (!DB) { setStat(false, 'Isi Database URL di Pengaturan room'); return; }
    setStat(false, 'Menyambung...');
    const ok = await syncClock();
    if (!ok) { setStat(false, 'Tidak bisa terhubung ke database. Cek URL.'); return; }
    setStat(true, 'Tersambung - room: ' + ROOM);
    listenTheme();
    try {
      es = new EventSource(stateUrl());
      es.addEventListener('put', (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.path === '/') { st = m.data; render(); }
        else fetch(stateUrl()).then((r) => r.json()).then((d) => { st = d; render(); });
      });
      es.onerror = () => setStat(false, 'Koneksi terputus, mencoba lagi...');
      es.onopen = () => setStat(true, 'Tersambung - room: ' + ROOM);
    } catch (e) { setStat(false, 'Browser tidak mendukung EventSource'); }
  }

  // ---------- Tema ----------
  const PRESETS = [['merah', 'Merah', '#d4161a'], ['biru', 'Biru', '#2f7bff'], ['cyan', 'Cyan', '#19d3ff'], ['hijau', 'Hijau', '#22d65a'],
                   ['amber', 'Amber', '#ffb000'], ['pink', 'Pink', '#ff4fa3'], ['ungu', 'Ungu', '#a65cff'], ['putih', 'Putih', '#f2f4f8']];
  let th = {}, themeEs = null;
  const themeUrl = () => `${DB}/rooms/${ROOM}/theme.json`;

  async function commitTheme(patch) {
    if (!DB) { flash('Isi Database URL dulu di Pengaturan room.'); $('cfg').open = true; return; }
    const next = Object.assign({}, th, patch);
    try {
      const r = await fetch(themeUrl(), { method: 'PUT', body: JSON.stringify(next) });
      if (!r.ok) throw new Error(r.status);
      th = (await r.json()) || {};
      renderTheme();
    } catch (e) { flash('Gagal menyimpan tema. Cek URL dan aturan (rules) Firebase.'); }
  }

  const sw = $('sw');
  PRESETS.forEach(([id, name, c]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.id = id;
    b.innerHTML = '<i style="background:' + c + '"></i>' + name;
    b.onclick = () => commitTheme({ preset: id });
    sw.append(b);
  });

  function renderTheme() {
    const cur = th.preset || 'merah';
    sw.querySelectorAll('button').forEach((b) => b.classList.toggle('sel', b.dataset.id === cur));
    if (th.main && document.activeElement !== $('cmain')) $('cmain').value = th.main;
    if (th.ink && document.activeElement !== $('cink')) $('cink').value = th.ink;
    const dim = th.dim != null ? Math.round(th.dim * 100) : 100, scl = th.scale != null ? Math.round(th.scale * 100) : 55;
    if (document.activeElement !== $('dim')) { $('dim').value = dim; $('dimv').textContent = dim + '%'; }
    if (document.activeElement !== $('scl')) { $('scl').value = scl; $('sclv').textContent = scl + '%'; }
  }

  let tT = 0;
  const later = (fn) => { clearTimeout(tT); tT = setTimeout(fn, 300); };
  $('cmain').oninput = () => later(() => commitTheme({ preset: 'custom', main: $('cmain').value, ink: $('cink').value }));
  $('cink').oninput = () => later(() => commitTheme({ ink: $('cink').value }));
  $('dim').oninput = () => { $('dimv').textContent = $('dim').value + '%'; later(() => commitTheme({ dim: $('dim').value / 100 })); };
  $('scl').oninput = () => { $('sclv').textContent = $('scl').value + '%'; later(() => commitTheme({ scale: $('scl').value / 100 })); };
  $('treset').onclick = async () => {
    if (!DB) return;
    try { await fetch(themeUrl(), { method: 'DELETE' }); th = {}; renderTheme(); } catch (e) { flash('Gagal mereset tema.'); }
  };

  function listenTheme() {
    if (themeEs) { themeEs.close(); themeEs = null; }
    try {
      themeEs = new EventSource(themeUrl());
      themeEs.addEventListener('put', (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.path === '/') { th = m.data || {}; renderTheme(); }
        else fetch(themeUrl()).then((r) => r.json()).then((d) => { th = d || {}; renderTheme(); });
      });
    } catch (e) {}
  }

  render();
  renderTheme();
  connect();
})();
</script>
</body>
</html>
